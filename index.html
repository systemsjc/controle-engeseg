<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engeseg Vigilância - Controle de Acessos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* Estilização da barra de rolagem customizada */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen" 
      x-data="appPortaria()" 
      x-init="initApp()">

    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="flex items-center justify-center">
                    <img src="logo-engeseg.png" class="h-11 w-auto object-contain max-w-[150px]" alt="Logo Engeseg Vigilância">
                </div>
                <div class="border-l border-slate-700 pl-4">
                    <h1 class="text-xl font-black tracking-wider uppercase text-white">Engeseg Vigilância</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Controle Operacional de Acesso</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <div :class="realtimeAtivo ? 'bg-emerald-500' : 'bg-rose-500'" class="h-2 w-2 rounded-full animate-pulse"></div>
                <div class="text-xs font-mono text-slate-400" x-text="realtimeAtivo ? 'Sincronizado' : 'Conectando...'"></div>
                <div class="text-sm font-mono text-slate-300 border-l border-slate-700 pl-3" x-text="horaAtual"></div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <section class="lg:col-span-4 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl h-fit">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center justify-between">
                <span>Novo Registro</span>
                <span class="text-xs font-normal text-slate-400">Guarita / Entrada</span>
            </h2>

            <form @submit.prevent="registrarEntrada()" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Tipo de Fluxo</label>
                    <div class="grid grid-cols-3 gap-2">
                        <template x-for="tipo in ['Motoboy', 'Uber', 'Prestador']">
                            <button
                                type="button"
                                @click="formData.tipo_visitante = tipo"
                                :class="formData.tipo_visitante === tipo 
                                    ? 'bg-blue-600 border-blue-500 text-white shadow-md shadow-blue-600/20' 
                                    : 'bg-slate-700/50 border-slate-600 text-slate-300 hover:bg-slate-700'"
                                class="py-2 px-3 rounded-lg font-bold text-sm transition-all border"
                                x-text="tipo"
                            ></button>
                        </template>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Placa</label>
                        <input
                            type="text"
                            maxlength="7"
                            placeholder="ABC1D23"
                            x-model="formData.placa"
                            @input="formData.placa = formData.placa.toUpperCase().replace(/[^A-Z0-9]/g, '')"
                            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-center text-lg font-mono font-bold tracking-widest text-white focus:outline-none focus:border-blue-500 uppercase placeholder-slate-600"
                            required
                        />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Destino</label>
                        <input
                            type="text"
                            placeholder="Ex: Bloco B / Ap 22"
                            x-model="formData.destino"
                            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-slate-600"
                            required
                        />
                    </div>
                </div>

                <div class="space-y-3 pt-2 border-t border-slate-700/50">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
                            Nome do Condutor <span x-show="formData.tipo_visitante === 'Prestador'" class="text-rose-400">*</span>
                        </label>
                        <input
                            type="text"
                            placeholder="Nome completo"
                            x-model="formData.nome_condutor"
                            :required="formData.tipo_visitante === 'Prestador'"
                            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-slate-600"
                        />
                    </div>

                    <div x-show="formData.tipo_visitante === 'Prestador'" x-transition>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Documento (RG/CPF)</label>
                        <input
                            type="text"
                            placeholder="000.000.000-00"
                            x-model="formData.documento"
                            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-slate-600"
                        />
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Modelo do Veículo</label>
                        <input
                            type="text"
                            placeholder="Ex: Fiat Punto / Titan Cinza"
                            x-model="formData.veiculo_modelo"
                            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-slate-600"
                        />
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Observações</label>
                        <textarea
                            rows="2"
                            placeholder="Alguma informação extra..."
                            x-model="formData.observacoes"
                            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-slate-600 resize-none"
                        ></textarea>
                    </div>
                </div>

                <button
                    type="submit"
                    :disabled="enviando"
                    class="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-blue-800 text-white p-3 rounded-lg font-bold text-sm tracking-wide shadow-lg shadow-blue-600/10 transition active:scale-[0.99] mt-2 flex justify-center items-center"
                >
                    <span x-show="!enviando">Confirmar Entrada</span>
                    <span x-show="enviando" class="animate-spin inline-block w-4 h-4 border-2 border-white border-b-transparent rounded-full"></span>
                </button>
            </form>
        </section>

        <section class="lg:col-span-8 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                    <span>Veículos Internos</span>
                    <span class="bg-slate-900 text-blue-400 text-xs px-2.5 py-0.5 rounded-full border border-slate-700 font-mono" x-text="veiculosInternos.length">
                        0
                    </span>
                </h2>
            </div>

            <div x-show="carregandoInicial" class="text-center py-20 text-slate-500">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-b-transparent rounded-full mb-3"></div>
                <p class="text-sm">Sincronizando com o Firebase Cloud...</p>
            </div>

            <div x-show="!carregandoInicial && veiculosInternos.length === 0" class="text-center py-16 border-2 border-dashed border-slate-700 rounded-xl bg-slate-900/20">
                <p class="text-slate-500 font-medium">Nenhum veículo ativo no momento.</p>
                <p class="text-xs text-slate-600 mt-1">Todos os fluxos de entrada foram liberados.</p>
            </div>

            <div x-show="!carregandoInicial && veiculosInternos.length > 0" class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[calc(100vh-220px)] overflow-y-auto pr-1">
                <template x-for="item in veiculosInternos" :key="item.id">
                    <div :class="obterBordaCard(item)" 
                         class="bg-slate-900/60 p-4 rounded-xl border-l-4 shadow-md flex justify-between items-start space-x-3 transition-all hover:bg-slate-900">
                        <div class="space-y-1.5 flex-1 min-w-0">
                            <div class="flex items-center space-x-2">
                                <span :class="obterBadgeEstilo(item.tipo_visitante)" 
                                      class="text-[10px] font-black uppercase px-2 py-0.5 rounded font-sans tracking-wider"
                                      x-text="item.tipo_visitante">
                                </span>
                                <span :class="obterCorTimer(item)" 
                                      class="text-xs font-mono font-semibold bg-slate-800/80 px-1.5 py-0.5 rounded">
                                    ⏱️ <span x-text="calcularPermanencia(item.data_entrada)"></span>
                                </span>
                            </div>
                            
                            <p class="text-xl font-mono font-black text-white tracking-wider truncate" x-text="item.placa"></p>

                            <div class="text-xs space-y-0.5">
                                <p class="text-slate-300 font-medium truncate">
                                    <span class="text-slate-500">Destino:</span> <span x-text="item.destino"></span>
                                </p>
                                <p class="text-slate-400 truncate" x-show="item.veiculo_modelo">
                                    <span class="text-slate-500">Veículo:</span> <span x-text="item.veiculo_modelo"></span>
                                </p>
                                <p class="text-slate-400 truncate" x-show="item.nome_condutor">
                                    <span class="text-slate-500">Condutor:</span> <span x-text="item.nome_condutor"></span>
                                </p>
                                <p class="text-slate-500 italic truncate text-[11px]" x-show="item.observacoes">
                                    "Obs: <span x-text="item.observacoes"></span>"
                                </p>
                            </div>
                        </div>

                        <button 
                            @click="registrarSaida(item.id)"
                            class="bg-emerald-600/90 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-md shadow-emerald-950/20 self-center"
                        >
                            Liberar
                        </button>
                    </div>
                </template>
            </div>
        </section>
        
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configurações extraídas da imagem enviada
        const firebaseConfig = {
            apiKey: "AIzaSyCzeD6FLlfNOnEnKlzyb25XA7sisU2Llgk",
            authDomain: "controle-engeseg.firebaseapp.com",
            projectId: "controle-engeseg",
            storageBucket: "controle-engeseg.firebasestorage.app",
            messagingSenderId: "999888889619",
            appId: "1:999888889619:web:b65e8d88dec7743aef76e6"
        };

        // Inicializar Firebase e Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Tornar referências disponíveis globalmente para o Alpine.js
        window.dbFirestore = db;
        window.fsMethods = { collection, addDoc, updateDoc, doc, query, where, onSnapshot };
    </script>

    <script>
        function appPortaria() {
            return {
                horaAtual: '',
                agora: new Date(),
                veiculosInternos: [],
                carregandoInicial: true,
                enviando: false,
                realtimeAtivo: false,
                formData: {
                    tipo_visitante: 'Motoboy',
                    nome_condutor: '',
                    documento: '',
                    placa: '',
                    veiculo_modelo: '',
                    destino: '',
                    observacoes: ''
                },

                initApp() {
                    this.atualizarRelogio();
                    setInterval(() => this.atualizarRelogio(), 1000);
                    
                    // Aguarda o script assíncrono do Firebase carregar completamente
                    setTimeout(() => {
                        this.conectarEouvirFirebase();
                    }, 600);

                    // Sincroniza a reatividade de contadores de tempo a cada 30 segundos
                    setInterval(() => {
                        this.agora = new Date();
                    }, 30000);
                },

                atualizarRelogio() {
                    const de = new Date();
                    this.horaAtual = de.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                },

                conectarEouvirFirebase() {
                    const { collection, query, where, onSnapshot } = window.fsMethods;
                    const db = window.dbFirestore;

                    // Query otimizada para rodar sem exigir a criação de índices compostos manuais
                    const q = query(
                        collection(db, "controle_acesso"), 
                        where("data_saida", "==", null)
                    );

                    onSnapshot(q, (snapshot) => {
                        let registros = [];
                        snapshot.forEach((doc) => {
                            registros.push({ id: doc.id, ...doc.data() });
                        });
                        
                        // Ordenação local estável pelo pátio para não depender de índices remotos complexos
                        registros.sort((a, b) => new Date(b.data_entrada) - new Date(a.data_entrada));
                        
                        this.veiculosInternos = registros;
                        this.carregandoInicial = false;
                        this.realtimeAtivo = true;
                    }, (error) => {
                        console.error("Erro na conexão realtime do Firebase:", error);
                        this.realtimeAtivo = false;
                    });
                },

                async registrarEntrada() {
                    this.enviando = true;
                    const { collection, addDoc } = window.fsMethods;
                    const db = window.dbFirestore;

                    try {
                        const novoRegistro = {
                            tipo_visitante: this.formData.tipo_visitante,
                            nome_condutor: this.formData.nome_condutor || null,
                            documento: this.formData.documento || null,
                            placa: this.formData.placa,
                            veiculo_modelo: this.formData.veiculo_modelo || null,
                            destino: this.formData.destino,
                            observacoes: this.formData.observacoes || null,
                            data_entrada: new Date().toISOString(),
                            data_saida: null
                        };

                        await addDoc(collection(db, "controle_acesso"), novoRegistro);

                        // Reset parcial limpando apenas strings mutáveis
                        this.formData = {
                            tipo_visitante: this.formData.tipo_visitante,
                            nome_condutor: '',
                            documento: '',
                            placa: '',
                            veiculo_modelo: '',
                            destino: '',
                            observacoes: ''
                        };
                    } catch (err) {
                        alert('Erro ao processar entrada: ' + err.message);
                    } finally {
                        this.enviando = false;
                    }
                },

                async registrarSaida(id) {
                    const { doc, updateDoc } = window.fsMethods;
                    const db = window.dbFirestore;

                    try {
                        const docRef = doc(db, "controle_acesso", id);
                        await updateDoc(docRef, {
                            data_saida: new Date().toISOString()
                        });
                    } catch (err) {
                        alert('Erro ao processar liberação: ' + err.message);
                    }
                },

                calcularPermanencia(dataEntrada) {
                    const entrada = new Date(dataEntrada);
                    const diferencaMs = this.agora - entrada;
                    const minutosTotais = Math.floor(diferencaMs / 60000);
                    
                    if (minutosTotais < 0) return '0 min';
                    if (minutosTotais < 60) {
                        return `${minutosTotais} min`;
                    }
                    const horas = Math.floor(minutosTotais / 60);
                    const mins = minutosTotais % 60;
                    return `${horas}h ${mins}m`;
                },

                obterMinutos(dataEntrada) {
                    const entrada = new Date(dataEntrada);
                    return Math.floor((this.agora - entrada) / 60000);
                },

                obterBordaCard(item) {
                    const minutos = this.obterMinutos(item.data_entrada);
                    if (item.tipo_visitante === 'Motoboy') {
                        return minutos > 15 ? 'border-rose-500 border-l-8 animate-pulse bg-rose-950/20' : 'border-amber-500';
                    }
                    if (item.tipo_visitante === 'Uber') {
                        return minutos > 10 ? 'border-rose-500' : 'border-slate-500';
                    }
                    return 'border-sky-500';
                },

                obterBadgeEstilo(tipo) {
                    if (tipo === 'Motoboy') return 'bg-amber-500/20 text-amber-400';
                    if (tipo === 'Uber') return 'bg-slate-700 text-slate-300';
                    return 'bg-sky-500/20 text-sky-400';
                },

                obterCorTimer(item) {
                    const minutes = this.obterMinutos(item.data_entrada);
                    if (item.tipo_visitante === 'Motoboy' && minutes > 15) return 'text-rose-400 font-bold';
                    if (item.tipo_visitante === 'Uber' && minutes > 10) return 'text-rose-400 font-bold';
                    return 'text-slate-400';
                }
            }
        }
    </script>
</body>
</html>
